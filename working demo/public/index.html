<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Approval Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TideCloak-ready demo</p>
          <h1>Expense Approval Center</h1>
        </div>
        <div class="badge">Two-manager quorum for expenses over $1,000</div>
      </header>

      <main class="layout">
        <section class="panel auth-panel">
          <h2>Sign in</h2>
          <div id="user-list" class="user-list"></div>
          <p id="login-status" class="status-text">No user signed in.</p>
        </section>

        <section class="panel submit-panel">
          <h2>Submit expense</h2>
          <form id="expense-form">
            <label>
              Amount
              <input type="number" id="amount" min="1" step="0.01" value="1200" required />
            </label>
            <label>
              Description
              <input type="text" id="description" value="CRM software renewal" required />
            </label>
            <button type="submit">Submit expense</button>
          </form>
        </section>

        <section class="panel admin-panel">
          <h2>Admin changes</h2>
          <p class="small-note">Policy change requires two different admins.</p>
          <div class="inline-fields">
            <input id="new-manager-list" type="text" value="maya,owen,sara" />
          </div>
          <button id="change-approvers-btn">Update approvers</button>
          <p id="admin-status" class="status-text"></p>
        </section>
      </main>

      <section class="panel table-panel">
        <h2>Expense queue</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Employee</th>
              <th>Amount</th>
              <th>Description</th>
              <th>Status</th>
              <th>Approvals</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expense-table-body"></tbody>
        </table>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>

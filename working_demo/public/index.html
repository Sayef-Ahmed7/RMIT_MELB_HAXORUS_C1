<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Paper Vault</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TideCloak governance demo</p>
          <h1>Exam Paper Vault</h1>
        </div>
        <div class="header-actions">
          <span class="badge">2-of-3 custodian quorum</span>
          <button id="reset-demo-btn" class="secondary-button">Reset demo</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel auth-panel">
          <h2>Who is acting</h2>
          <div id="user-list" class="user-list"></div>
          <p id="login-status" class="status-text">No user signed in.</p>
        </section>

        <section class="panel upload-panel">
          <h2>Upload paper</h2>
          <form id="paper-form">
            <label>
              Title
              <input id="paper-title" type="text" value="Probability Revision Pack" required />
            </label>
            <label>
              Subject
              <input id="paper-subject" type="text" value="Statistics" required />
            </label>
            <label>
              Exam date
              <input id="paper-date" type="date" value="2026-12-05" required />
            </label>
            <label>
              Paper content
              <textarea id="paper-content" rows="6" required>Answer both questions on probability distributions and justify each result with a worked method.</textarea>
            </label>
            <button type="submit">Encrypt and store paper</button>
          </form>
        </section>

        <section class="panel notification-panel">
          <h2>Notifications</h2>
          <div id="notifications-feed" class="notification-feed"></div>
        </section>
      </main>

      <section class="panel table-panel">
        <h2>Vault status</h2>
        <div id="paper-list" class="paper-list"></div>
      </section>

      <section class="panel audit-panel">
        <h2>Audit log</h2>
        <div id="audit-log" class="audit-log"></div>
      </section>

      <section class="panel attack-panel">
        <h2>Attack panel</h2>
        <div class="attack-actions">
          <button id="admin-open-alone-btn">Admin requests open alone</button>
          <button id="read-database-btn">Read database directly</button>
          <button id="admin-custodian-btn">Admin tries to add self as custodian</button>
          <button id="custodian-quorum-btn">Custodian 1 + Custodian 2 approve</button>
        </div>
        <pre id="attack-output" class="attack-output">Demo output will appear here.</pre>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
